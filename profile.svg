<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Animated ASCII Gradient -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#818CF8;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#22D3EE;#818CF8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Scanlines Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.03"/>
    </pattern>

    <!-- Cyberpunk Moving Laser Line Gradient -->
    <linearGradient id="scanLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip Path for Moving Laser Scanner -->
    <clipPath id="windowClip">
      <rect x="15" y="15" width="970" height="520" rx="8"/>
    </clipPath>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing Animation Clip Paths -->
    <clipPath id="info_line_0"><rect x="470" y="110.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.50s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_1"><rect x="470" y="131.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.62s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_2"><rect x="470" y="152.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.74s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_3"><rect x="470" y="173.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.86s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_4"><rect x="470" y="194.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.98s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_5"><rect x="470" y="215.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.10s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_7"><rect x="470" y="257.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.22s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_8"><rect x="470" y="278.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.34s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_9"><rect x="470" y="299.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.46s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_10"><rect x="470" y="320.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.58s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_11"><rect x="470" y="341.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.70s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_13"><rect x="470" y="383.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.82s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_14"><rect x="470" y="404.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.94s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_15"><rect x="470" y="425.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="2.06s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_16"><rect x="470" y="446.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="2.18s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');
    .term-text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      white-space: pre;
    }
    .glow-border {
      filter: drop-shadow(0 0 4px #22D3EE40);
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="550" fill="url(#bgGlow)" rx="12"/>
  <rect width="1000" height="550" fill="url(#scanlines)" rx="12"/>

  <!-- Outer Window Shell -->
  <g class="glow-border">
    <!-- Main Outer Border -->
    <rect x="15" y="15" width="970" height="520" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="8"/>
  </g>

  <!-- Window Header Title Bar -->
  <g>
    <!-- Window Controls (Mac Style) -->
    <circle cx="40" cy="35" r="5" fill="#EF4444"/>
    <circle cx="55" cy="35" r="5" fill="#F59E0B"/>
    <circle cx="70" cy="35" r="5" fill="#10B981"/>
    
    <!-- Terminal Command/Title -->
    <text x="50%" y="40" fill="#64748B" font-size="12" font-family="'Fira Code', 'JetBrains Mono', monospace" text-anchor="middle">
      kseenivasan39-del@devos ~ % ./profile.sh --live
    </text>
    
    <!-- Scanning Status -->
    <text x="910" y="40" fill="#EF4444" font-size="11" font-family="'Fira Code', 'JetBrains Mono', monospace" font-weight="bold" letter-spacing="1">
      ● SCANNING
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </text>
  </g>

