      kseenivasan39-del@devos
    </text>
    
    <!-- Divider Line under user heading -->
    <line x1="470" y1="94" x2="955" y2="94" stroke="#334155" stroke-dasharray="3,3"/>

    <!-- Key-Value Lines -->
    <text x="470" y="125.00" fill="#9CA3AF" font-size="13" clip-path="url(#info_line_0)"><tspan fill="#10B981" font-weight="bold">Subject</tspan><tspan fill="#4B5563">.............</tspan> <tspan fill="#F3F4F6">Anish</tspan></text>
