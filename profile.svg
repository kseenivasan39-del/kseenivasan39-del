<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Animated ASCII Gradient -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#818CF8;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#22D3EE;#818CF8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Scanlines Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.03"/>
    </pattern>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing Animation Clip Paths -->
    <clipPath id="info_line_0"><rect x="470" y="65.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.50s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_1"><rect x="470" y="87.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.62s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_2"><rect x="470" y="109.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.74s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_3"><rect x="470" y="131.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.86s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_4"><rect x="470" y="153.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="0.98s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_5"><rect x="470" y="175.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.10s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_7"><rect x="470" y="219.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.22s" fill="freeze"/></rect></clipPath>
  <clipPath id="info_line_8"><rect x="470" y="241.00" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.5s" begin="1.34s" fill="freeze"/></rect></clipPath>
